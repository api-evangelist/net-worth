name: Net Worth
description: >-
  netWorth (networth.mx) is a Mexico City fintech founded in 2016 and a 500
  Startups (500 Global) Batch 10 company that helps individuals plan and manage
  retirement in Mexico. It specializes in Planes Personales de Retiro (PPR) and
  long-term savings and investment plans, combining human financial advisors
  (asesores) with digital tools such as retirement calculators and simulators,
  and commercializes plans backed by insurers and financial institutions such as
  Allianz and Skandia (Optimaxx Plus). The consumer product surfaces are a
  Webflow marketing site plus a client app at retiro.networth.mx and an
  authenticated portal at api.networth.mx; there is no public developer API,
  OpenAPI specification, or SDK program at this time.
